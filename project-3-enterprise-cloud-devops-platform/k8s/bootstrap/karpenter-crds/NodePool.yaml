apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  # 1. Template: Pods ke liye node specifications
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default # Yahan apiVersion nahi aayega

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r", "t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]

  # 2. Limits: v1 mein spec level par aata hai
  limits:
    cpu: "100"
    memory: 100Gi

  # 3. Disruption: v1 mein spec level par aata hai
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m