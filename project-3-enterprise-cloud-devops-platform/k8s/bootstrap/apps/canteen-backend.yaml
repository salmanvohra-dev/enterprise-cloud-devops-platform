apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canteen-backend-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/salmanvohra-dev/enterprise-cloud-devops-platform.git'
    targetRevision: main
    path: k8s/apps/canteen-backend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true