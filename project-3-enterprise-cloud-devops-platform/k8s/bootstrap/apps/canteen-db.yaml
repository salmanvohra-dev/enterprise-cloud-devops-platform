apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canteen-db
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vohrasalman/enterprise-cloud-devops-platform.git
    targetRevision: main
    path: project-3-enterprise-cloud-devops-platform/k8s/apps/canteen-db
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true