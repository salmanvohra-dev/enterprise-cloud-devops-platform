apiVersion: apps/v1
kind: Deployment
metadata:
  name: canteen-backend
  namespace: prod
  labels:
    app: canteen-backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canteen-backend
      version: v1
  template:
    metadata:
      labels:
        app: canteen-backend
        version: v1
    spec:
      containers:
        - name: web
          image: public.ecr.aws/nginx/nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: canteen-backend-svc
  namespace: prod
  labels:
    app: canteen-backend
spec:
  type: ClusterIP
  selector:
    app: canteen-backend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: canteen-backend-hpa
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canteen-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80