apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: canteen-backend-destination
  namespace: prod
spec:
  host: canteen-backend-svc.prod.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL