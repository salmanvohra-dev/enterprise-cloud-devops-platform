apiVersion: apps/v1
kind: Deployment
metadata:
  name: canteen-frontend
  namespace: prod
  labels:
    app: canteen-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canteen-frontend
  template:
    metadata:
      labels:
        app: canteen-frontend
    spec:
      containers:
        - name: frontend
          image: public.ecr.aws/nginx/nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: canteen-frontend-svc
  namespace: prod
  labels:
    app: canteen-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: canteen-frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: canteen-frontend-hpa
  namespace: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canteen-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80